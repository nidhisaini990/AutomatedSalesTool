services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_agent}
      POSTGRES_USER: ${POSTGRES_USER:-sales_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sales_agent}:${POSTGRES_PASSWORD:-localdev-only}@db:5432/${POSTGRES_DB:-sales_agent}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
